name: build
on:
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: merge
        run: python3 build.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfw-proxy-domains.txt gfw-proxy-domains-full.txt stats.json README.md
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
